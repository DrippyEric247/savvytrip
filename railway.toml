# SavvyTrip static SPA — set VITE_API_URL in Railway service variables before build.
[build]
builder = "NIXPACKS"
# Nixpacks already runs `npm ci` when package-lock.json exists — do not run it again here
# (a second `npm ci` can EBUSY on node_modules/.cache during rmdir on Railway).
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
